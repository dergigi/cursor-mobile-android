name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, do not publish release)"
        required: false
        default: "false"
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Extract version info
        id: version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" != "v$VERSION_NAME" ]]; then
            echo "Error: tag $TAG_NAME does not match versionName v$VERSION_NAME"
            exit 1
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
            release-assets/cursor-mobile-v${{ steps.version.outputs.version_name }}.apk

      - name: Generate update.json
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "${{ steps.version.outputs.tag_name }}" | sed -e 's/"/\\"/g' -e '$a\')
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Release ${{ steps.version.outputs.tag_name }}"
          fi
          jq -n \
            --arg versionCode "${{ steps.version.outputs.version_code }}" \
            --arg versionName "${{ steps.version.outputs.version_name }}" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/cursor-mobile-v${{ steps.version.outputs.version_name }}.apk" \
            --arg releaseNotes "$TAG_MESSAGE" \
            '{
              versionCode: ($versionCode | tonumber),
              versionName: $versionName,
              apkUrl: $apkUrl,
              releaseNotes: $releaseNotes
            }' > release-assets/update.json

      - name: Upload artifacts (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: release-assets/*

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
